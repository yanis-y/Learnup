{% extends 'base.html' %}
{% block title %}{{ title }} — Flashcards{% endblock %}

{% block content %}
<div class="breadcrumb">
  <a href="{% url 'dashboard' %}">Accueil</a>
  <span>/</span>
  <a href="{% url 'theme_detail' theme.id %}">{{ theme.name }}</a>
  <span>/</span>
  <span>{{ title }}</span>
</div>

<div class="card" style="max-width:680px;">
  <h1 class="card-title" style="margin-bottom:1.25rem;">{{ title }}</h1>
  <p class="text-muted" style="margin-bottom:1rem;font-size:0.9rem;">Thème : <strong>{{ theme.name }}</strong></p>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="question">Question</label>
      <textarea id="question" name="question" rows="4" autofocus required
                placeholder="Entrez la question...">{{ question }}</textarea>
    </div>
    <div class="form-group">
      <label for="answer">Réponse</label>
      <textarea id="answer" name="answer" rows="4" required
                placeholder="Entrez la réponse...">{{ answer }}</textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Enregistrer</button>
      {% if not card %}
      <button type="submit" name="add_another" value="1" class="btn btn-outline">Enregistrer + Ajouter</button>
      {% endif %}
      <a href="{% url 'theme_detail' theme.id %}" class="btn btn-outline">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
