{% extends 'base.html' %}
{% block title %}Créer un compte — Learnup{% endblock %}

{% block content %}
<div class="auth-box">
  <div class="auth-logo">Learnup</div>
  <h1 class="auth-title">Créer un compte</h1>

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="username">Identifiant</label>
      <input type="text" id="username" name="username" autofocus required autocomplete="username"
             placeholder="Choisissez un identifiant">
    </div>
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required autocomplete="new-password"
             placeholder="6 caractères minimum">
    </div>
    <div class="form-group">
      <label for="password2">Confirmer le mot de passe</label>
      <input type="password" id="password2" name="password2" required autocomplete="new-password"
             placeholder="Répétez le mot de passe">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;">Créer mon compte</button>
  </form>

  <p class="auth-alt">Déjà un compte ?
    <a href="{% url 'login' %}">Se connecter</a>
  </p>
</div>
{% endblock %}
