{% extends 'base.html' %}
{% block title %}Connexion — Learnup{% endblock %}

{% block content %}
<div class="auth-box">
  <div class="auth-logo">Learnup</div>
  <h1 class="auth-title">Connexion</h1>

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="username">Identifiant</label>
      <input type="text" id="username" name="username" autofocus required autocomplete="username"
             placeholder="Votre identifiant">
    </div>
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required autocomplete="current-password"
             placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;">Se connecter</button>
  </form>

  <p class="auth-alt">Pas encore de compte ?
    <a href="{% url 'register' %}">Créer un compte</a>
  </p>
</div>
{% endblock %}
